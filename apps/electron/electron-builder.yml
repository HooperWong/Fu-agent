# electron-builder 配置
# 文档: https://www.electron.build/configuration/configuration

appId: com.fuagent.app
productName: Fu Agent
copyright: Copyright © 2026 Fu Agent

# Electron 版本（CI 环境 bun workspace 下无法自动检测，需显式指定）
electronVersion: 40.6.1

# 目录配置
directories:
  output: out
  buildResources: resources

# 压缩配置
compression: normal

# ASAR 打包配置（禁用 ASAR，避免 SDK symlink 路径越界问题）
asar: false

# 跳过 npm install（代码已被 esbuild/Vite 打包，npm 不识别 workspace:* 协议）
npmRebuild: false

# 通用文件配置
files:
  - dist/**/*
  - package.json

# 说明：主进程 external 的 @anthropic-ai/claude-agent-sdk 与 node-cron
# 会由 electron-builder 按生产依赖自动收集到 resources/app/node_modules，
# 无需再用 extraFiles 复制（否则会重复占用上百 MB）。

# 通用额外资源
extraResources:
  # 默认 Skills 模板（首次启动时同步到默认工作区）
  - from: default-skills
    to: default-skills
    filter:
      - "**/*"
  # 版本更新日志（设置 → 关于）
  - from: ../../CHANGELOG.md
    to: CHANGELOG.md
  # 开源许可与第三方声明（设置 → 关于）
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE.md
    to: NOTICE.md
  - from: ../../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md

# ============================================
# macOS 配置
# ============================================
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # macOS 额外资源
  extraResources:
    # Bun 二进制（download-bun.ts 使用 darwin-${arch} 命名）
    - from: "vendor/bun/darwin-${arch}"
      to: "vendor/bun"
      filter:
        - "**/*"

# DMG 配置
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# ============================================
# Windows 配置
# ============================================
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Windows 额外资源
  extraResources:
    # 应用图标（运行时 BrowserWindow / 托盘使用，保证任务栏与窗口显示 Fu 图标）
    - from: resources/icon.ico
      to: icon.ico
    - from: resources/tray-icon.ico
      to: tray-icon.ico
    # Bun 二进制
    - from: "vendor/bun/win32-${arch}"
      to: "vendor/bun"
      filter:
        - "**/*"

# NSIS 安装程序配置
nsis:
  oneClick: false
  # 个人使用：按用户安装到 LOCALAPPDATA，无需管理员权限，data/ 可写
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fu Agent

# 发布：个人本地构建，不配置远端自动更新，避免指向 fork 上游仓库
